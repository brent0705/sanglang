/*检查统一编号*/
function idchk(idvalue) {
   var tmp = new String("12121241");
   var sum = 0;
   re = /^\d{8}$/;
   if (!re.test(idvalue)) {
       //return "格式不正确";
       return false;
    }
   for (i=0; i< 8; i++) {
     s1 = parseInt(idvalue.substr(i,1));
     s2 = parseInt(tmp.substr(i,1));
     sum += cal(s1*s2);
   }
   if (!valid(sum)) {
      if (idvalue.substr(6,1)=="7") return(valid(sum+1));
   }  
   return(valid(sum));
}
function valid(n) {
   return (n%10 == 0)?true:false;
}
function cal(n) {
   var sum=0;
   while (n!=0) {
      sum += (n % 10);
      n = (n - n%10) / 10;  // 取整数
     }
   return sum;
}
